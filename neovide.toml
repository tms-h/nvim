# Neovide's startup-only settings (everything else is lua/gui.lua), shared by
# Linux and Windows. Neovide reads this file when NEOVIDE_CONFIG points at it,
# or when it is linked to ~/.config/neovide/config.toml. The Mac uses
# neovide-macos.toml (the same plus window chrome Linux rejects).

# Dividers are drawn as lines, not font glyphs: every joint lines up, and the
# width is set here in pixels. Light (│ ─) is the resting divider; heavy
# (┃ ━) is the divider under the pointer (lua/dividers.lua).
[box-drawing]
mode = "native"

[box-drawing.sizes]
default = [1, 3]
