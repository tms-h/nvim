# Neovide's startup-only settings, shared by Linux and Windows; the rest are
# set at runtime (lua/gui.lua, opacity in lua/theme.lua). Neovide reads this
# file when NEOVIDE_CONFIG points at it, or when it is linked to
# ~/.config/neovide/config.toml. The Mac uses neovide-macos.toml (the same
# dividers, drawn thicker for Retina, plus window chrome Linux rejects).

# Dividers are drawn as lines, not font glyphs: every joint lines up, and the
# width is set here in pixels. Light (│ ─) is the resting divider; heavy
# (┃ ━) is the divider under the pointer (lua/dividers.lua).
[box-drawing]
mode = "native"

[box-drawing.sizes]
default = [1, 3]
