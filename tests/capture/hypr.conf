# Nested copy of the live look (~/.config/hypr/looknfeel.lua, everforest theme):
# 2px gaps, 7px corners, 2px accent border, live blur values.
monitor = , 1920x1080@60, 0x0, 1
animations {
    enabled = false
}
decoration {
    rounding = 7
    blur {
        enabled = true
        size = 4
        passes = 2
        brightness = 0.75
        vibrancy = 0.2
        popups = true
    }
}
general {
    gaps_in = 2
    gaps_out = 2
    border_size = 2
    col.active_border = rgb(7ad5c9) rgb(b5db7a) 45deg
}
cursor {
    invisible = true
}
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    disable_autoreload = true
}
ecosystem {
    no_update_news = true
    no_donation_nag = true
}
xwayland {
    enabled = false
}
# Omarchy default window opacity (default/hypr/windows.lua)
windowrule = match:class .*, opacity 0.985 0.96

# Captures: no config-format or launcher warnings over the window.
debug {
    suppress_errors = true
}
