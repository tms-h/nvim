# neovide.toml plus macOS window chrome (Linux Neovide rejects "transparent").
# Line widths are the old Mac values (Retina pixels: half as thick on screen).

# Keep the real traffic-light buttons, drop the title strip.
frame = "transparent"
title-hidden = true
system-fullscreen-hotkey = "cmd+ctrl+f"

[box-drawing]
mode = "native"

[box-drawing.sizes]
default = [2, 4]
